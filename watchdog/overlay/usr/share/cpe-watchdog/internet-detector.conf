config main 'config'
    option mode '0'
    option logging_level '6'

config instance 'internet'
    option enabled '1'
    option description 'HTTPS 断网自动恢复'
    option check_type '2'
    list urls 'https://www.baidu.com/'
    list urls 'https://www.qq.com/'
    list urls 'https://www.bing.com/'
    option interval_up '300'
    option interval_down '300'
    option connection_attempts '1'
    option connection_timeout '15'
    option mod_reboot_enabled '0'
    option mod_network_restart_enabled '0'
    option mod_modem_restart_enabled '0'
    option mod_regular_script_enabled '0'
    option mod_led_control_enabled '0'
    option mod_public_ip_enabled '0'
    option mod_email_enabled '0'
    option mod_telegram_enabled '0'
    option mod_user_scripts_enabled '1'
    option mod_user_scripts_dead_period '0'
    option mod_user_scripts_down_script_attempts '0'
    option mod_user_scripts_down_script_attempt_interval '300'
    option mod_user_scripts_disconnected_at_startup '1'
    option mod_user_scripts_connected_at_startup '0'
