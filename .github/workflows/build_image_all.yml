name: BuildImage-all
on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: "0 21 * * *"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          versions=()
          excludes=()
          for prefix in 24.10 25.12; do
            sdk=$(curl -sf "https://hub.docker.com/v2/repositories/openwrt/sdk/tags/?page_size=100&name=x86-64-${prefix}" \
              | jq -r '.results[].name' | grep -oP '(?<=x86-64-)\d+\.\d+\.\d+(-rc\d+)?$')
            ib=$(curl -sf "https://hub.docker.com/v2/repositories/openwrt/imagebuilder/tags/?page_size=100&name=x86-64-${prefix}" \
              | jq -r '.results[].name' | grep -oP '(?<=x86-64-)\d+\.\d+\.\d+(-rc\d+)?$')
            ver=$(comm -12 <(echo "$sdk" | sort) <(echo "$ib" | sort) \
              | sed 's/-rc/~rc/' | sort -V | tail -1 | sed 's/~rc/-rc/')
            if [[ -n "$ver" ]]; then
              versions+=("\"$ver\"")
              # mediatek-filogic（NRadio C8-668GL）只上 25.12+：官方对该设备的
              # 支持晚于 24.10 分支，24.10 的 imagebuilder 里没有这个 profile
              if [[ "$prefix" == "24.10" ]]; then
                excludes+=("{\"version\":\"$ver\",\"arch\":\"mediatek-filogic\"}")
              fi
            fi
          done
          ver_json=$(IFS=,; echo "${versions[*]}")
          excl_json=$(IFS=,; echo "${excludes[*]}")
          echo "matrix={\"version\":[${ver_json}],\"arch\":[\"x86-64\",\"rockchip-armv8\",\"mediatek-filogic\"],\"exclude\":[${excl_json}]}" >> $GITHUB_OUTPUT
  build_passwall:
    needs: [setup]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: Build Passwall for OpenWRT-${{ matrix.arch }}-${{ matrix.version }}
    runs-on: ubuntu-latest
    container: 
      image: openwrt/sdk:${{ matrix.arch }}-${{ matrix.version }}
      options: --user root
    defaults:
      run:
        shell: bash
    steps:

    - name: Install golang
      run: |
        VERSION=$(curl -sL https://go.dev/VERSION?m=text | head -1)
        echo "Installing Go version: $VERSION"
        wget -q https://go.dev/dl/$VERSION.linux-amd64.tar.gz
        rm -rf /usr/local/go
        tar -C /usr/local -xzf $VERSION.linux-amd64.tar.gz
        rm -f $VERSION.linux-amd64.tar.gz
        export GOROOT=/usr/local/go
        export PATH=$PATH:/usr/local/go/bin
        go version

    - name: Run Make
      run: |
        export VOLUME_HOME=$(pwd)
        export BUILD_DIR="/builder"
        export BUILDER="buildbot"
        export GOROOT=/usr/local/go
        export PATH=$PATH:/usr/local/go/bin
        cd $BUILD_DIR
        apt-get update
        apt install sudo tree -y
        sudo -u $BUILDER echo "src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> "feeds.conf.default"
        sudo -u $BUILDER echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> "feeds.conf.default"
        chown -R $BUILDER:$BUILDER $BUILD_DIR
        while ! sudo -u $BUILDER ./scripts/feeds update -a; do echo "Try again"; done
        sudo -u $BUILDER ./scripts/feeds install luci-app-passwall
        sudo -u $BUILDER make defconfig
        sudo -u $BUILDER make package/feeds/luci/luci-base/host/compile
        ### enable SingBox
        sudo -u $BUILDER sed -i 's/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox is not set/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y/' .config
        ### enable all passwall packages
        # sudo -u $BUILDER sed -i "s/# \(CONFIG_PACKAGE_luci-app-passwall_.*\) is not set/\1=y/g" .config
        ### disable singbox
        # sudo -u $BUILDER sed -i '/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y/ s/=y/=n/' .config
        ### disable v2ray-plugin
        # sudo -u $BUILDER sed -i '/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=y/ s/=y/=n/' .config
        ### set golang external bootstrap root
        # sed -i 's|CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT=""|CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT="/usr/local/go"|' .config
        sudo -u $BUILDER make package/luci-app-passwall/compile V=99 -j1 || cat logs/feeds/passwall/luci-app-passwall/dump.txt
        mkdir -p $VOLUME_HOME/passwall
        cp -r bin/packages/*/passwall/* $VOLUME_HOME/passwall
        cp -r bin/packages/*/passwall_packages/* $VOLUME_HOME/passwall
        ### do not copy all packages, just copy passwall and passwall_packages
        # cp -r bin/packages/*/packages/* $VOLUME_HOME/passwall
        # cp -r bin/packages $VOLUME_HOME/passwall
        tree bin/packages

    - uses: actions/upload-artifact@v7
      with:
        name: passwall-${{ matrix.arch }}-${{ matrix.version }}
        path: passwall
        retention-days: 7

  build_theme_argon:
    needs: [setup]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: Build Argon for OpenWRT-${{ matrix.arch }}-${{ matrix.version }}
    runs-on: ubuntu-latest
    container:
      image: openwrt/sdk:${{ matrix.arch }}-${{ matrix.version }}
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5
    - name: Set package extension
      run: |
        if [[ "${{ matrix.version }}" == 24.* ]]; then
          echo "PKG_EXT=ipk" >> $GITHUB_ENV
        else
          echo "PKG_EXT=apk" >> $GITHUB_ENV
        fi
    - name: Run Make
      run: |
        export VOLUME_HOME=$(pwd)
        export BUILD_DIR="/builder"
        export BUILDER="buildbot"
        cd $BUILD_DIR
        apt-get update
        apt install sudo -y
        sudo -u $BUILDER git clone https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
        while ! sudo -u $BUILDER ./scripts/feeds update -a; do echo "Try again"; done
        sudo -u $BUILDER make defconfig
        sudo -u $BUILDER make package/luci-theme-argon/compile V=s -j1
        mkdir -p $VOLUME_HOME/luci-theme-argon
        cp bin/packages/*/base/luci-theme-argon*.${{ env.PKG_EXT }} $VOLUME_HOME/luci-theme-argon/
    - uses: actions/upload-artifact@v7
      with:
        name: luci-theme-argon-${{ matrix.arch }}-${{ matrix.version }}
        path: luci-theme-argon
        retention-days: 7

  build_bandix:
    needs: [setup]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: Build Bandix for OpenWRT-${{ matrix.arch }}-${{ matrix.version }}
    runs-on: ubuntu-latest
    container:
      image: openwrt/sdk:${{ matrix.arch }}-${{ matrix.version }}
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5
    - name: Set package extension
      run: |
        if [[ "${{ matrix.version }}" == 24.* ]]; then
          echo "PKG_EXT=ipk" >> $GITHUB_ENV
        else
          echo "PKG_EXT=apk" >> $GITHUB_ENV
        fi
    - name: Run Make
      run: |
        export VOLUME_HOME=$(pwd)
        export BUILD_DIR="/builder"
        export BUILDER="buildbot"
        cd $BUILD_DIR
        apt-get update
        apt install sudo -y
        # Clone both repositories
        sudo -u $BUILDER git clone https://github.com/timsaya/openwrt-bandix.git package/openwrt-bandix
        sudo -u $BUILDER git clone https://github.com/timsaya/luci-app-bandix.git package/luci-app-bandix
        chown -R $BUILDER:$BUILDER $BUILD_DIR
        while ! sudo -u $BUILDER ./scripts/feeds update -a; do echo "Try again"; done
        # Install feeds to get luac and other tools
        sudo -u $BUILDER ./scripts/feeds install -a
        sudo -u $BUILDER make defconfig
        # Build host tools first (luac, po2lmo, etc.)
        sudo -u $BUILDER make package/luci-base/host/compile V=s -j1
        sudo -u $BUILDER make package/luci-base/compile V=s -j1
        # Compile backend first (dependency for frontend)
        sudo -u $BUILDER make package/openwrt-bandix/openwrt-bandix/compile V=s -j1
        # Compile frontend
        sudo -u $BUILDER make package/luci-app-bandix/luci-app-bandix/compile V=s -j1
        mkdir -p $VOLUME_HOME/bandix
        # Copy bandix packages (note: backend package is named 'bandix', not 'openwrt-bandix')
        cp bin/packages/*/base/bandix*.${{ env.PKG_EXT }} $VOLUME_HOME/bandix/ 2>/dev/null || true
        cp bin/packages/*/base/luci-app-bandix*.${{ env.PKG_EXT }} $VOLUME_HOME/bandix/ 2>/dev/null || true
    - uses: actions/upload-artifact@v7
      with:
        name: bandix-${{ matrix.arch }}-${{ matrix.version }}
        path: bandix
        retention-days: 7
  
  # luci app netdata has some bugs, so just not use it for now!
  build_luci_app_netdata:
    if: false  # Disabled due to bugs
    needs: [setup]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: Build Luci App Netdata for OpenWRT-${{ matrix.arch }}-${{ matrix.version }}
    runs-on: ubuntu-latest
    container:
      image: openwrt/sdk:${{ matrix.arch }}-${{ matrix.version }}
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5
    - name: Set package extension
      run: |
        if [[ "${{ matrix.version }}" == 24.* ]]; then
          echo "PKG_EXT=ipk" >> $GITHUB_ENV
        else
          echo "PKG_EXT=apk" >> $GITHUB_ENV
        fi
    - name: Run Make
      run: |
        export VOLUME_HOME=$(pwd)
        export BUILD_DIR="/builder"
        export BUILDER="buildbot"
        cd $BUILD_DIR
        apt-get update
        apt install sudo -y
        sudo -u $BUILDER git clone https://github.com/sirpdboy/luci-app-netdata package/luci-app-netdata
        while ! sudo -u $BUILDER ./scripts/feeds update -a; do echo "Try again"; done
        sudo -u $BUILDER ./scripts/feeds install -a
        sudo -u $BUILDER make defconfig
        sudo -u $BUILDER make package/luci-app-netdata/compile V=s -j1
        mkdir -p $VOLUME_HOME/luci-app-netdata
        cp bin/packages/*/base/luci-app-netdata*.${{ env.PKG_EXT }} $VOLUME_HOME/luci-app-netdata/
    - uses: actions/upload-artifact@v7
      with:
        name: luci-app-netdata-${{ matrix.arch }}-${{ matrix.version }}
        path: luci-app-netdata
        retention-days: 7

  # uuplugin 测试套件（uu/uuplugin/tests，434 断言，纯 shell 无需 SDK）。
  # 作为 build_uuplugin 的前置门禁：套件红 -> 不出包 -> build_image 下载
  # artifact 失败 -> 镜像不出。不改动其它 job 的 always() 语义。
  test_uuplugin:
    name: UUplugin test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5
    - name: Run suite
      run: |
        cd uu/uuplugin/tests
        sh run.sh

  build_uuplugin:
    needs: [setup, test_uuplugin]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: Build UUplugin for OpenWRT-${{ matrix.arch }}-${{ matrix.version }}
    runs-on: ubuntu-latest
    container:
      image: openwrt/sdk:${{ matrix.arch }}-${{ matrix.version }}
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v5
    - name: Set package extension
      run: |
        if [[ "${{ matrix.version }}" == 24.* ]]; then
          echo "PKG_EXT=ipk" >> $GITHUB_ENV
        else
          echo "PKG_EXT=apk" >> $GITHUB_ENV
        fi
    - name: Run Make
      run: |
        export VOLUME_HOME=$(pwd)
        export BUILD_DIR="/builder"
        export BUILDER="buildbot"
        cd $BUILD_DIR
        apt-get update
        apt install sudo tree -y
        # uuplugin DEPENDS +luci-app-passwall：编包只需要 feed 元数据能把依赖
        # 解析出来；真正的 passwall 包由 build_passwall 任务产出并一起进镜像
        sudo -u $BUILDER echo "src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> "feeds.conf.default"
        sudo -u $BUILDER echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> "feeds.conf.default"
        cp -r $VOLUME_HOME/uu/uuplugin-bin package/uuplugin-bin
        cp -r $VOLUME_HOME/uu/uuplugin package/uuplugin
        cp -r $VOLUME_HOME/uu/luci-app-uuplugin package/luci-app-uuplugin
        chown -R $BUILDER:$BUILDER $BUILD_DIR
        while ! sudo -u $BUILDER ./scripts/feeds update -a; do echo "Try again"; done
        sudo -u $BUILDER ./scripts/feeds install -a
        sudo -u $BUILDER make defconfig
        # Build host tools first (luac, po2lmo, etc.) — same fix as build_bandix
        sudo -u $BUILDER make package/luci-base/host/compile V=s -j1
        sudo -u $BUILDER make package/luci-base/compile V=s -j1
        sudo -u $BUILDER make package/uuplugin-bin/compile V=s -j1
        sudo -u $BUILDER make package/uuplugin/compile V=s -j1
        sudo -u $BUILDER make package/luci-app-uuplugin/compile V=s -j1
        mkdir -p $VOLUME_HOME/uuplugin-out
        # 一个 glob 收四个包：uuplugin-bin / uuplugin / luci-app-uuplugin /
        # luci-i18n-uuplugin-zh-cn（luci.mk 派生的中文包；本目录整体进
        # mypackages，即随镜像强装，无需改 PACKAGES 列表）。刻意不加
        # "|| true"：收不到包就该红在这里，而不是静默产出一个没有 uu 的镜像
        cp bin/packages/*/base/*uuplugin*.${{ env.PKG_EXT }} $VOLUME_HOME/uuplugin-out/
        tree bin/packages
        ls -la $VOLUME_HOME/uuplugin-out/
    - uses: actions/upload-artifact@v7
      with:
        name: uuplugin-${{ matrix.arch }}-${{ matrix.version }}
        path: uuplugin-out
        retention-days: 7

  build_image:
    needs: [setup, build_passwall, build_theme_argon, build_bandix, build_uuplugin]
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: Build Image for OpenWRT-${{ matrix.arch }}-${{ matrix.version }}
    runs-on: ubuntu-latest
    # container: 
    #   image: openwrt/imagebuilder:${{ matrix.arch }}-${{ matrix.version }}
    #   options: --user root
    defaults:
      run:
        shell: bash
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@v8
      with:
        root-reserve-mb: 1024
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout
      uses: actions/checkout@v5

    - uses: actions/download-artifact@v8
      with:
        name: passwall-${{ matrix.arch }}-${{ matrix.version }}
    - uses: actions/download-artifact@v8
      with:
        name: luci-theme-argon-${{ matrix.arch }}-${{ matrix.version }}
    - uses: actions/download-artifact@v8
      with:
        name: bandix-${{ matrix.arch }}-${{ matrix.version }}
    - uses: actions/download-artifact@v8
      with:
        name: uuplugin-${{ matrix.arch }}-${{ matrix.version }}
    # - uses: actions/download-artifact@v8
    #   with:
    #     name: luci-app-netdata-${{ matrix.arch }}-${{ matrix.version }}

    - name: modify docker path
      run: |
        sudo systemctl stop docker.socket
        sudo systemctl stop docker
        sudo mkdir -p ${{ github.workspace }}/docker 
        sudo mv /var/lib/docker ${{ github.workspace }}/docker 
        sudo ln -sf ${{ github.workspace }}/docker /var/lib/docker
        sudo systemctl start docker


    - name: Prepare Packages
      run: |
        export VOLUME_HOME=${{ github.workspace }}
        mkdir -p $VOLUME_HOME/mypackages
        # Support both .ipk (24.x) and .apk (25.x) package formats
        find $VOLUME_HOME -maxdepth 1 -type f \( -name "*.ipk" -o -name "*.apk" \) -exec mv {} $VOLUME_HOME/mypackages/ \;

    - name: Set profile
      run: |
        if [[ "${{ matrix.arch }}" == "x86-64" ]]; then
          echo "profile=generic" >> $GITHUB_ENV
        elif [[ "${{ matrix.arch }}" == "rockchip-armv8" ]]; then
          echo "profile=friendlyarm_nanopi-r2s" >> $GITHUB_ENV
        elif [[ "${{ matrix.arch }}" == "mediatek-filogic" ]]; then
          # NRadio C8-668GL：官方 profile，无自定义 DTS/补丁
          echo "profile=nradio_c8-668gl" >> $GITHUB_ENV
        fi
    - name: Set packages
      run: |
        # 三个 arch 共用的主列表（与改动前的全局列表逐字对应，抽走的四个
        # arch 相关包在下面分支里补回，集合等价）
        COMMON="luci luci-app-qos luci-app-upnp luci-proto-ipv6"
        COMMON="$COMMON luci-i18n-base-zh-cn netdata luci-app-ttyd pciutils"
        COMMON="$COMMON coreutils-timeout lm-sensors lm-sensors-detect fdisk shadow-useradd -dnsmasq"
        COMMON="$COMMON vim python3 sudo ipset samba4-server wget-ssl"
        COMMON="$COMMON openvpn-openssl luci-app-openvpn lsof kmod-usb-storage block-mount lsblk luci-app-samba4"
        COMMON="$COMMON tcpdump zstd tmux bash netcat ip6tables-mod-nat iptables-mod-tproxy dnsmasq-full"
        COMMON="$COMMON xl2tpd kmod-loop nfs-kernel-server iptables-mod-socket"
        COMMON="$COMMON iptables-mod-iprange kmod-nft-socket kmod-nft-tproxy kmod-nft-nat"
        COMMON="$COMMON wireguard-tools kmod-wireguard luci-proto-wireguard wakeonlan luci-app-wol"
        if [[ "${{ matrix.arch }}" == "mediatek-filogic" ]]; then
          # C8-668GL 是 5G CPE：qmi/cdc/usb-serial 内核驱动已在官方
          # DEVICE_PACKAGES 里，这里补蜂窝 WAN 的用户态 proto 与短信工具。
          # 不装 hostapd/wpa-supplicant：带 wifi 的 target 默认自带
          # wpad-basic，重复装会文件冲突
          echo "packages=$COMMON luci-proto-qmi luci-proto-mbim sms-tool" >> $GITHUB_ENV
        else
          # x86/rockchip 的硬件包：kmod-igc（Intel 2.5G 网卡）、
          # kmod-mt7921e（PCIe 无线卡）；二者无默认 wpad，无线要显式装
          echo "packages=$COMMON kmod-igc kmod-mt7921e hostapd wpa-supplicant" >> $GITHUB_ENV
        fi
    - name: Make Image
      run: |
        export VOLUME_HOME=${{ github.workspace }}
        export BUILD_DIR="/builder"
        export BUILDER="buildbot"
        chmod +x $VOLUME_HOME/build_image.sh
        docker run -i --name openwrt-imagebuilder-${{ matrix.arch }}-${{ matrix.version }} \
         --user root \
         -v $VOLUME_HOME/mypackages/:$BUILD_DIR/packages/mypackages/ \
         -v $VOLUME_HOME/openwrt_output/:/openwrt_output/ \
         -v $VOLUME_HOME/build_image.sh:/build_image.sh \
         -e PROFILE=${{ env.profile }} \
         -e PACKAGES="${{ env.packages }}" \
         -e ROOTFS_SIZE=${{ env.rootfs_size }} \
         -e KERNEL_SIZE=${{ env.kernel_size }} \
         -e ARCH=${{ matrix.arch }} \
         -e VERSION=${{ matrix.version }} \
         openwrt/imagebuilder:${{ matrix.arch }}-${{ matrix.version }} /build_image.sh 

      env:
        rootfs_size: 4096
        kernel_size: 256
    - uses: actions/upload-artifact@v7
      with:
        name: openwrt-${{ matrix.arch }}-${{ matrix.version }}
        path: openwrt_output
        retention-days: 30
